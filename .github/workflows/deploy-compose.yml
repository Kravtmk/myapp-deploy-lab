name: Deploy MyApp with Docker Compose

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kravtmk/myapp-deploy-lab

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kravtmk/myapp-deploy-lab:latest
            ghcr.io/kravtmk/myapp-deploy-lab:${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::324711056718:role/GitHub-MyApp-Deploy-Role
          aws-region: eu-north-1

      - name: Deploy with AWS SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0e77e02de72638fb3" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":[
              "cd /home/ubuntu/myapp",
              "echo IMAGE_TAG=${{ github.sha }} > .env",
              "docker compose pull",
              "docker compose up -d"
            ]}' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0e77e02de72638fb3"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0e77e02de72638fb3" \
            --query '{
              Status:Status,
              Output:StandardOutputContent,
              Error:StandardErrorContent
            }'

