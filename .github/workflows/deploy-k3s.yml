name: Build and Push MyApp

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kravtmk/myapp-deploy-lab

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kravtmk/myapp-deploy-lab:latest
            ghcr.io/kravtmk/myapp-deploy-lab:${{ github.sha }}
      - name: Update Kubernetes image tag
        run: |
          sed -i "s|image: ghcr.io/kravtmk/myapp-deploy-lab:.*|image: ghcr.io/kravtmk/myapp-deploy-lab:${{ github.sha }}|" k8s/deployment.yaml

      - name: Commit Kubernetes manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml
          git commit -m "Deploy ${{ github.sha }}" || exit 0
          git push
