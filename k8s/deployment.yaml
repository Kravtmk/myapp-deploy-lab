apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: myapp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: myapp

  template:
    metadata:
      labels:
        app: myapp

    spec:
      containers:
        - name: myapp
          image: ghcr.io/kravtmk/myapp-deploy-lab:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8000
